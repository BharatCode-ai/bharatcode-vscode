# kilocode_change - new file
name: Website sign-in candidate

on:
  workflow_dispatch:
    inputs:
      reuse_verified_backends:
        description: "Reuse only verified run 44186017306 backends; rebuild extension packages"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: oauth-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      KILO_VERSION: 7.8.114
      KILO_CLI_TARGETS: win32-x64,win32-arm64,linux-x64,linux-arm64,linux-x64-musl,linux-arm64-musl,darwin-x64,darwin-arm64
      KILO_SKIP_BUNDLED_BWRAP: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Download and verify fixed parent backends
        if: inputs.reuse_verified_backends
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/BharatCode-ai/bharatcode-vscode/actions/artifacts/14373729058 > "$RUNNER_TEMP/parent-metadata.json"
          gh api repos/BharatCode-ai/bharatcode-vscode/actions/artifacts/14373729058/zip > "$RUNNER_TEMP/parent.zip"
          python3 -B packages/kilo-vscode/script/reuse-candidate.py prepare \
            --metadata "$RUNNER_TEMP/parent-metadata.json" --archive "$RUNNER_TEMP/parent.zip" \
            --root "$RUNNER_TEMP/verified-parent"
          echo "CLI_DIST_DIR=$RUNNER_TEMP/verified-parent/dist" >> "$GITHUB_ENV"
      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ inputs.reuse_verified_backends && '--os=linux --cpu=x64' || '--os=* --cpu=*' }}
      - name: Verify source and release guards
        run: |
          bun script/check-workflows.ts
          bun script/check-md-table-padding.ts
          bun script/check-opencode-annotations.ts --base 1e97696076bafea5ff4010627108ca50a162d9eb
          bun script/extract-source-links.ts --check
          python3 -B -m unittest discover -s packages/kilo-vscode/tests -p 'test_*.py'
          bunx prettier --check .github/workflows/oauth-candidate.yml .github/workflows/release.yml .github/workflows/checks.yml packages/kilo-vscode/package.json packages/kilo-vscode/src/constants.ts packages/kilo-vscode/src/extension.ts packages/kilo-vscode/tests/unit/extension-identity.test.ts packages/kilo-vscode/tests/unit/reuse-candidate-resources.test.ts packages/kilo-vscode/script/build.ts packages/kilo-vscode/script/publish.ts packages/kilo-vscode/webview-ui/src/components/chat/FeedbackDialog.tsx packages/kilo-vscode/webview-ui/src/components/marketplace/MarketplaceContribute.tsx packages/kilo-vscode/webview-ui/src/components/settings/AboutKiloCodeTab.tsx
      - name: Verify website sign-in and command wiring
        working-directory: packages/kilo-vscode
        run: >-
          bun --config=/dev/null test --preload ./tests/setup/vscode-mock.ts
          ./tests/unit/bharatcode-website-signin.test.ts
          ./tests/unit/extension-arch.test.ts
          ./tests/unit/extension-identity.test.ts
          ./tests/unit/namespace-migration.test.ts
          ./tests/unit/configuration-lifecycle.test.ts
          ./tests/unit/bharatcode-catalog-ui.test.ts
          ./tests/unit/model-selector-lifecycle.test.ts
          ./tests/unit/kilo-provider-provider-refresh.test.ts
          ./tests/unit/kilo-provider-catalog.test.ts
          ./tests/unit/provider-actions-save.test.ts
          ./tests/unit/provider-context-catalog.test.ts
          ./tests/unit/reuse-candidate-resources.test.ts
          ../opencode/test/plugin/bharatcode.test.ts
      - name: Verify catalog recovery without session disposal
        working-directory: packages/opencode
        run: >-
          bun test
          test/kilocode/provider/bharatcode-catalog.test.ts
          test/kilocode/provider/bharatcode-catalog-cache.test.ts
          test/kilocode/provider/catalog-refresh-route.test.ts
          test/kilocode/catalog-recovery.test.ts
          test/kilocode/model-cache-effect.test.ts
          test/kilocode/model-cache-org.test.ts
          --timeout 30000
      - name: Build bundled backends
        if: ${{ !inputs.reuse_verified_backends }}
        working-directory: packages/opencode
        run: bun script/build.ts --skip-install
      - name: Build and check extension packages
        working-directory: packages/kilo-vscode
        run: |
          export PATH="$PWD/node_modules/.bin:$PATH"
          bun run check-kilocode-change
          bun run check-types:webview
          bun script/build.ts
      - name: Audit exact candidate packages
        if: ${{ !inputs.reuse_verified_backends }}
        run: >-
          python3 packages/kilo-vscode/script/audit-vsix.py
          --version "$KILO_VERSION" --receipt
      - name: Audit derived packages and unchanged backend resources
        if: inputs.reuse_verified_backends
        run: >-
          python3 -B packages/kilo-vscode/script/reuse-candidate.py verify
          --root "$RUNNER_TEMP/verified-parent"
          --out packages/kilo-vscode/out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-oauth-${{ github.sha }}
          path: |
            packages/kilo-vscode/out/*.vsix
            packages/kilo-vscode/out/candidate.json
            packages/kilo-vscode/out/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
